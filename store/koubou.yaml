project:
  name: Loan EMI & SIP Calculator
  device: iPhone 16 Pro - Black Titanium - Portrait
  output_dir: screenshots/framed
  output_size: iPhone6_9

defaults:
  background:
    type: linear
    direction: 180
    colors:
      - '#CFE3F2'
      - '#F7FBFD'

screenshots:
  01-emi:
    content:
      - type: text
        content: Loan EMI Calculator
        position: ['50%', '5.5%']
        size: 70
        weight: bold
        color: '#132230'
      - type: text
        content: Home, car and personal loan EMI in seconds
        position: ['50%', '10.5%']
        size: 36
        color: '#59697A'
      - type: image
        asset: screenshots/raw/01-emi.png
        frame: true
        position: ['50%', '60%']
        scale: 0.84

  02-tracker:
    content:
      - type: text
        content: EMI Tracker with Reminders
        position: ['50%', '5.5%']
        size: 70
        weight: bold
        color: '#132230'
      - type: text
        content: See principal and interest still to pay
        position: ['50%', '10.5%']
        size: 36
        color: '#59697A'
      - type: image
        asset: screenshots/raw/02-tracker.png
        frame: true
        position: ['50%', '60%']
        scale: 0.84

  03-compare:
    content:
      - type: text
        content: Step-up EMI Calculator
        position: ['50%', '5.5%']
        size: 70
        weight: bold
        color: '#132230'
      - type: text
        content: Finish the loan years sooner
        position: ['50%', '10.5%']
        size: 36
        color: '#59697A'
      - type: image
        asset: screenshots/raw/03-compare.png
        frame: true
        position: ['50%', '60%']
        scale: 0.84

  04-schedule:
    content:
      - type: text
        content: Amortisation Schedule
        position: ['50%', '5.5%']
        size: 70
        weight: bold
        color: '#132230'
      - type: text
        content: Change the inputs. Export PDF or Excel
        position: ['50%', '10.5%']
        size: 36
        color: '#59697A'
      - type: image
        asset: screenshots/raw/04-schedule.png
        frame: true
        position: ['50%', '60%']
        scale: 0.84

  05-tools:
    content:
      - type: text
        content: Home Loan Tax Benefit
        position: ['50%', '5.5%']
        size: 70
        weight: bold
        color: '#132230'
      - type: text
        content: Section 80C and 24(b) savings by year
        position: ['50%', '10.5%']
        size: 36
        color: '#59697A'
      - type: image
        asset: screenshots/raw/05-tools.png
        frame: true
        position: ['50%', '60%']
        scale: 0.84

  06-currency:
    content:
      - type: text
        content: No-cost EMI Calculator
        position: ['50%', '5.5%']
        size: 70
        weight: bold
        color: '#132230'
      - type: text
        content: See the hidden GST and fee cost
        position: ['50%', '10.5%']
        size: 36
        color: '#59697A'
      - type: image
        asset: screenshots/raw/06-currency.png
        frame: true
        position: ['50%', '60%']
        scale: 0.84

  07-all:
    content:
      - type: text
        content: EMI, SIP, FD, PPF, NPS
        position: ['50%', '5.5%']
        size: 70
        weight: bold
        color: '#132230'
      - type: text
        content: Free. No account. No ads.
        position: ['50%', '10.5%']
        size: 36
        color: '#59697A'
      - type: image
        asset: screenshots/raw/07-all.png
        frame: true
        position: ['50%', '60%']
        scale: 0.84
