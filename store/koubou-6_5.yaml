project:
  name: Loan EMI & SIP Calculator
  device: iPhone 16 Pro - Black Titanium - Portrait
  output_dir: screenshots/framed-6_5
  output_size: iPhone6_5

defaults:
  background:
    type: linear
    direction: 180
    colors:
      - '#CFE3F2'
      - '#F7FBFD'

screenshots:
  01-emi:
    content:
      - type: text
        content: Know your EMI in seconds
        position: ['50%', '5.5%']
        size: 66
        weight: bold
        color: '#132230'
      - type: text
        content: See exactly how much is interest
        position: ['50%', '10.5%']
        size: 34
        color: '#59697A'
      - type: image
        asset: screenshots/raw/01-emi.png
        frame: true
        position: ['50%', '60%']
        scale: 0.84

  02-tracker:
    content:
      - type: text
        content: Track every instalment
